version: "2.2"

services:
  gh_rehosted:
    build: .
    privileged: true
    mac_address: "00:FF:FF:FF:FF:FF"
    networks:
      29713fcce95204990e164759f6c0b46551df8eb5c8f5873602087032e14de553ghbridge0:
        ipv4_address: 172.21.0.2
      29713fcce95204990e164759f6c0b46551df8eb5c8f5873602087032e14de553ghbridge1:
        ipv4_address: 192.168.1.1
      29713fcce95204990e164759f6c0b46551df8eb5c8f5873602087032e14de553ghbridge2:
        ipv4_address: 192.168.2.1
    ports:
      - 80:80/tcp
      - 80:80/udp
      - 81:81/tcp
      - 81:81/udp
      - 443:443/tcp
      - 443:443/udp

networks:
   29713fcce95204990e164759f6c0b46551df8eb5c8f5873602087032e14de553ghbridge0:
     driver: bridge
     ipam:
       config:
       - subnet: 172.21.0.0/24
         gateway: 172.21.0.1
   29713fcce95204990e164759f6c0b46551df8eb5c8f5873602087032e14de553ghbridge1:
     driver: bridge
     ipam:
       config:
       - subnet: 192.168.1.0/24
         gateway: 192.168.1.3
   29713fcce95204990e164759f6c0b46551df8eb5c8f5873602087032e14de553ghbridge2:
     driver: bridge
     ipam:
       config:
       - subnet: 192.168.2.0/24
         gateway: 192.168.2.2
